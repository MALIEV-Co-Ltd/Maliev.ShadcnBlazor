name: Deploy interactive showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build trusted Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore workload manifests
        run: dotnet workload restore Maliev.ShadcnBlazor.slnx
      - name: Restore locked dependencies
        run: dotnet restore Maliev.ShadcnBlazor.slnx --locked-mode
      - name: Build
        run: dotnet build Maliev.ShadcnBlazor.slnx -c Release --no-restore
      - name: Run repository tests
        run: dotnet test tests/Maliev.ShadcnBlazor.RepositoryTests/Maliev.ShadcnBlazor.RepositoryTests.csproj -c Release --no-build --no-restore
      - name: Run component tests
        run: dotnet test tests/Maliev.ShadcnBlazor.Tests/Maliev.ShadcnBlazor.Tests.csproj -c Release --no-build --no-restore
      - name: Publish Showcase
        run: dotnet publish samples/Maliev.ShadcnBlazor.Showcase/Maliev.ShadcnBlazor.Showcase.csproj -c Release --no-build --no-restore -o artifacts/pages
      - name: Prepare repository-scoped Pages artifact
        shell: pwsh
        run: ./eng/Prepare-GitHubPages.ps1 -PublishDirectory artifacts/pages/wwwroot -BasePath /Maliev.ShadcnBlazor/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/pages/wwwroot

  deploy:
    name: Deploy public Showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Release NuGet package

on:
  release:
    types: [published]

concurrency:
  group: nuget-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Validate and publish
    runs-on: windows-2022
    timeout-minutes: 30
    environment: nuget
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore workload manifests
        run: dotnet workload restore Maliev.ShadcnBlazor.slnx
      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a SemVer tag prefixed with v." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          project_version="$(dotnet msbuild src/Maliev.ShadcnBlazor/Maliev.ShadcnBlazor.csproj -getProperty:VersionPrefix -nologo)"
          if [[ "$version" != "$project_version" ]]; then
            echo "Release tag $version does not match VersionPrefix $project_version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore locked dependencies
        run: dotnet restore Maliev.ShadcnBlazor.slnx --locked-mode
      - name: Build
        run: dotnet build Maliev.ShadcnBlazor.slnx -c Release --no-restore
      - name: Run repository tests
        run: dotnet test tests/Maliev.ShadcnBlazor.RepositoryTests/Maliev.ShadcnBlazor.RepositoryTests.csproj -c Release --no-build --no-restore
      - name: Run component tests
        run: dotnet test tests/Maliev.ShadcnBlazor.Tests/Maliev.ShadcnBlazor.Tests.csproj -c Release --no-build --no-restore
      - name: Install Chromium
        shell: pwsh
        run: ./tests/Maliev.ShadcnBlazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps
      - name: Run browser tests
        run: dotnet test tests/Maliev.ShadcnBlazor.BrowserTests/Maliev.ShadcnBlazor.BrowserTests.csproj -c Release --no-build --no-restore
      - name: Pack immutable release
        run: dotnet pack src/Maliev.ShadcnBlazor/Maliev.ShadcnBlazor.csproj -c Release --no-build --no-restore -o artifacts/package -p:Version=${{ steps.version.outputs.version }}
      - name: Verify public package
        shell: pwsh
        run: ./eng/Verify-PublicSurface.ps1 -Root . -Package artifacts/package/Maliev.ShadcnBlazor.${{ steps.version.outputs.version }}.nupkg
      - name: Attest packages
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v2.2.0
        with:
          subject-path: |
            artifacts/package/Maliev.ShadcnBlazor.${{ steps.version.outputs.version }}.nupkg
            artifacts/package/Maliev.ShadcnBlazor.${{ steps.version.outputs.version }}.snupkg
      - name: Get short-lived NuGet credential
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.0.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet.org
        run: dotnet nuget push artifacts/package/Maliev.ShadcnBlazor.${{ steps.version.outputs.version }}.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      - name: Attach packages to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/package/*.*nupkg

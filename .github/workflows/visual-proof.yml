name: Component visual proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Generate reviewed baselines on the CI Windows image
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  proof:
    name: Review all component dossiers
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore workload manifests
        run: dotnet workload restore Maliev.ShadcnBlazor.slnx
      - name: Restore locked dependencies
        run: dotnet restore Maliev.ShadcnBlazor.slnx --locked-mode
      - name: Build visual proof
        run: dotnet build tests/Maliev.ShadcnBlazor.BrowserTests/Maliev.ShadcnBlazor.BrowserTests.csproj -c Release --no-restore
      - name: Install Chromium
        shell: pwsh
        run: ./tests/Maliev.ShadcnBlazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps
      - name: Compare all reviewed component dossiers
        env:
          SHADCN_UPDATE_VISUAL_BASELINES: ${{ inputs.update-baselines && '1' || '0' }}
        run: dotnet test tests/Maliev.ShadcnBlazor.BrowserTests/Maliev.ShadcnBlazor.BrowserTests.csproj -c Release --no-build --no-restore --filter ComponentCatalogVisualProofTests
      - name: Upload screenshots and diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-visual-proof
          path: |
            artifacts/visual-proof
            docs/evidence/component-catalog-baselines
          if-no-files-found: warn
          retention-days: 7
